<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <!-- Google muestra el favicon junto al resultado: pide un múltiplo de 48px. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbf1f2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title y description de arranque. El build (scripts/prerender.mjs) los
      reemplaza en el HTML de cada ruta por los de useDocumentMeta, y agrega
      ahí el canonical, og:url, og:image y el JSON-LD de esa página.
    -->
    <title>Cire Depilación — Depilación láser, cera y HIFU</title>
    <meta
      name="description"
      content="Depilación láser de diodo, cera, HIFU y tratamientos corporales. Consulta los paquetes por zona y agenda tu cita por WhatsApp."
    />
    <!-- Fijos para todo el sitio; los de cada página los agrega el prerender. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cire Depilación" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Especialista de Cire aplicando depilación láser diodo" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
